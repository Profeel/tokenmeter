name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build Release app & CLI
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Package Release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"
          cp -R TokenMeter.app "${DIST_DIR}/"
          cp .build/release/tokenmeter "${DIST_DIR}/"
          ditto -c -k --keepParent "${DIST_DIR}" "TokenMeter-${VERSION}-macos-arm64.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TokenMeter-${{ github.ref_name }}-macos-arm64.zip
          generate_release_notes: true
